<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.6.1/github-markdown-light.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <a href="{{ '/guides/' | relative_url }}">Guides</a>
      <a href="{{ '/references/' | relative_url }}">References</a>
      <a href="{{ '/open-discussions/' | relative_url }}">Open discussions</a>
      <a href="{{ '/archive/' | relative_url }}">Archive</a>
    </div>
  </nav>
  <div class="container markdown-body">
    {{ content }}
  </div>
</body>
</html>
